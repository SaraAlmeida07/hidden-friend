@if (isOffline()) {
  <div class="fixed top-0 left-0 right-0 z-[100] bg-destructive text-destructive-foreground px-4 py-2.5 text-center text-xs font-semibold tracking-wide flex items-center justify-center gap-2 shadow-md animate-in fade-in slide-in-from-top duration-300">
    <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
    <span>Sem conexão com a internet. O aplicativo está operando em modo offline.</span>
  </div>
}
<router-outlet />
