<header class="sticky top-0 z-50 w-full border-b border-zinc-200/20 bg-zinc-950/80 backdrop-blur-md">
  <div class="container mx-auto px-4 h-16 flex items-center justify-between md:relative">
    <div class="flex items-center gap-2">
      <!-- Hamburger Toggle for Mobile -->
      <button (click)="layoutService.toggleSidenav()" class="md:hidden p-2 -ml-2 text-zinc-400 hover:text-white transition-colors" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-indigo-600 shadow-[0_0_15px_rgba(79,70,229,0.5)]"></div>
        <span class="text-xl font-bold tracking-tight text-white">HiddenFriend</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <button class="rounded-full bg-zinc-900 p-2 text-zinc-400 transition-all hover:bg-zinc-800 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <div class="h-8 w-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500"></div>
    </div>
  </div>
</header>
